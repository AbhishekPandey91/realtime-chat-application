<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realtime Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f0f2f5; color: #111; height: 100vh; height: 100dvh; }
  .hidden { display: none !important; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; background: #128c7e; color: #fff; }
  button.link { background: none; color: #128c7e; padding: 2px 6px; align-self: center; }
  input { padding: 9px; border: 1px solid #ccc; border-radius: 6px; width: 100%; }

  #auth { max-width: 340px; margin: 10vh auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px #0002; }
  #auth h2 { margin-top: 0; }
  #auth form > * { margin-bottom: 10px; display: block; }
  #auth .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  #auth .tabs button { flex: 1; background: #ddd; color: #333; }
  #auth .tabs button.active { background: #128c7e; color: #fff; }
  #authError { color: #c00; font-size: 13px; min-height: 18px; }

  #app { display: flex; height: 100vh; height: 100dvh; }
  #sidebar { width: 320px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; min-height: 0; }
  #sideHeader { padding: 12px; background: #128c7e; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  #sideHeader button { background: #0d6b60; padding: 4px 10px; }
  #wsDot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #e33; margin-right: 6px; }
  #wsDot.on { background: #4f4; }
  #searchBox { padding: 10px; border-bottom: 1px solid #eee; position: relative; }
  #searchResults { position: absolute; left: 10px; right: 10px; top: 52px; background: #fff; border: 1px solid #ddd; border-radius: 6px; z-index: 5; max-height: 220px; overflow-y: auto; }
  #searchResults div { padding: 9px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  #searchResults div:hover { background: #f5f5f5; }
  #convList { flex: 1; overflow-y: auto; }
  .conv { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .conv:hover, .conv.active { background: #eef6f5; }
  .conv .name { font-weight: 600; }
  .conv .preview { font-size: 13px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .badge { background: #25d366; color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 7px; align-self: center; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #bbb; margin-right: 6px; }
  .dot.on { background: #25d366; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #chatHeader { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; min-height: 56px; display: flex; justify-content: space-between; align-items: center; }
  #chatHeader small { display: block; color: #666; }
  .ai-btn { background: #673ab7; font-size: 12px; padding: 5px 10px; margin-left: 6px; }
  .ai-btn:hover { background: #5e35b1; }
  .ai-btn:disabled { opacity: 0.6; cursor: wait; }
  #aiSummaryBanner { background: #f3e5f5; color: #4a148c; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #e1bee7; display: flex; justify-content: space-between; align-items: flex-start; }
  #aiSummaryBanner button { background: none; color: #888; padding: 0 4px; font-size: 14px; cursor: pointer; border: none; }
  #aiSuggestionsBar { background: #f5f5f5; padding: 8px 12px; border-top: 1px solid #ddd; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .ai-pill { background: #e8eaf6; color: #1a237e; border: 1px solid #c5cae9; border-radius: 16px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: background 0.2s; }
  .ai-pill:hover { background: #c5cae9; }
  #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: #e5ddd5; }
  .msg { max-width: 70%; padding: 7px 10px; border-radius: 8px; background: #fff; align-self: flex-start; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: #dcf8c6; }
  .msg .meta { font-size: 11px; color: #777; text-align: right; margin-top: 2px; white-space: normal; }
  .tick { margin-left: 4px; color: #888; }
  .tick.read { color: #34b7f1; }
  #composer { display: flex; gap: 8px; padding: 10px; background: #f0f0f0; }
  #empty { margin: auto; color: #666; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 10; }

  @media (max-width: 700px) { #sidebar { width: 130px; } .conv .preview { display: none; } }
</style>
</head>
<body>

<div id="auth" class="hidden">
  <h2>Realtime Chat</h2>
  <div class="tabs">
    <button id="tabLogin" class="active" type="button">Login</button>
    <button id="tabRegister" type="button">Register</button>
  </div>
  <form id="authForm">
    <input id="fUsername" placeholder="username" class="hidden" autocomplete="username" />
    <input id="fEmail" placeholder="email" type="email" autocomplete="email" required />
    <input id="fPassword" placeholder="password" type="password" autocomplete="current-password" required />
    <div id="authError"></div>
    <button id="authSubmit" type="submit">Login</button>
  </form>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div id="sideHeader">
      <span><span id="wsDot"></span><b id="meName"></b></span>
      <button id="logoutBtn" type="button">Logout</button>
    </div>
    <div id="searchBox">
      <input id="searchInput" placeholder="Search username..." autocomplete="off" />
      <div id="searchResults" class="hidden"></div>
    </div>
    <div id="convList"></div>
  </div>
  <div id="main">
    <div id="chatHeader"><span id="headerText">Select or search a user to start chatting</span></div>
    <div id="aiSummaryBanner" class="hidden"></div>
    <div id="messages"><div id="empty">No chat selected</div></div>
    <div id="aiSuggestionsBar" class="hidden"></div>
    <form id="composer" class="hidden">
      <input id="msgInput" placeholder="Type a message" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
  // Same-origin when served by the backend (works on localhost and in production).
  // If opened directly as a file, fall back to local backend.
  const API = location.protocol === "file:" ? "http://localhost:3000" : location.origin;

  function readStored(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (_) { return null; }
  }

  let token = localStorage.getItem("token");
  let me = readStored("me");
  let ws = null, reconnectDelay = 1000, reconnectTimer = null;
  let conversations = [];
  let active = null;        // { convId, user }
  let messages = [];
  let nextCursor = null;
  let loadingOlder = false;
  let pollTimer = null, reloadTimer = null, searchTimer = null, toastTimer = null;
  let authMode = "login";

  const $ = (id) => document.getElementById(id);
  const myId = () => me && (me.id || me._id);

  function el(tag, props = {}, ...children) {
    const n = document.createElement(tag);
    Object.assign(n, props);
    children.forEach((c) => n.append(c));
    return n;
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hidden"), 2500);
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: "Bearer " + token } : {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && token) {
      logout(false);
      toast("Session expired, please login again");
      throw new Error("unauthorized");
    }
    return { ok: res.ok, data };
  }

  /* ---------- AUTH ---------- */
  function setAuthMode(mode) {
    authMode = mode;
    $("tabLogin").classList.toggle("active", mode === "login");
    $("tabRegister").classList.toggle("active", mode === "register");
    $("fUsername").classList.toggle("hidden", mode === "login");
    $("fPassword").autocomplete = mode === "login" ? "current-password" : "new-password";
    $("authSubmit").textContent = mode === "login" ? "Login" : "Register";
    $("authError").textContent = "";
  }
  $("tabLogin").onclick = () => setAuthMode("login");
  $("tabRegister").onclick = () => setAuthMode("register");

  async function doLogin(email, password) {
    const { ok, data } = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ email, password }),
    });
    if (!ok) { $("authError").textContent = data.message || "Login failed"; return false; }
    token = data.data.accessToken;
    me = data.data.user;
    localStorage.setItem("token", token);
    localStorage.setItem("me", JSON.stringify(me));
    return true;
  }

  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    $("authError").textContent = "";
    const email = $("fEmail").value.trim();
    const password = $("fPassword").value;
    const btn = $("authSubmit");
    btn.disabled = true;
    try {
      if (authMode === "register") {
        const username = $("fUsername").value.trim();
        if (!username) { $("authError").textContent = "Username is required"; return; }
        const { ok, data } = await api("/api/auth/register", {
          method: "POST",
          body: JSON.stringify({ username, email, password }),
        });
        if (!ok) { $("authError").textContent = data.message || "Register failed"; return; }
      }
      if (await doLogin(email, password)) {
        $("fPassword").value = "";
        startApp();
      }
    } catch (err) {
      if (err.message !== "unauthorized") $("authError").textContent = "Network error";
    } finally {
      btn.disabled = false;
    }
  };

  function logout(callApi = true) {
    if (callApi && token) api("/api/auth/logout", { method: "POST" }).catch(() => {});
    // Detach the socket first so its late onclose can't trigger a reconnect.
    clearTimeout(reconnectTimer);
    clearTimeout(reloadTimer);
    clearTimeout(searchTimer);
    clearInterval(pollTimer);
    const s = ws;
    ws = null;
    if (s) s.close();
    token = null; me = null; active = null; messages = []; conversations = []; nextCursor = null;
    localStorage.removeItem("token");
    localStorage.removeItem("me");
    $("wsDot").classList.remove("on");
    $("searchResults").classList.add("hidden");
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
  }
  $("logoutBtn").onclick = () => logout(true);

  /* ---------- APP START ---------- */
  function startApp() {
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("meName").textContent = me.username;
    renderHeader();
    renderConversations();
    renderChat();
    connectWS();
    loadConversations();
    clearInterval(pollTimer);
    pollTimer = setInterval(loadConversations, 60000); // refreshes online/offline status
  }

  /* ---------- WEBSOCKET ---------- */
  function connectWS() {
    clearTimeout(reconnectTimer);
    if (!token) return;
    if (ws) { const old = ws; ws = null; old.close(); }

    const socket = new WebSocket(API.replace(/^http/, "ws") + "?token=" + encodeURIComponent(token));
    ws = socket;

    socket.onopen = () => {
      if (ws !== socket) return;
      reconnectDelay = 1000;
      $("wsDot").classList.add("on");
      loadConversations();
      if (active && active.convId) loadMessages(active.convId);
    };
    socket.onclose = (e) => {
      if (ws !== socket) return; // stale socket (logout or replaced)
      $("wsDot").classList.remove("on");
      if (e.code === 4001 || e.code === 4002) { logout(false); toast("Session expired, please login again"); return; }
      reconnectTimer = setTimeout(connectWS, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    };
    socket.onmessage = (ev) => {
      if (ws !== socket) return;
      try { handleWS(JSON.parse(ev.data)); } catch (err) { console.error("Bad WS message", err); }
    };
  }

  function wsSend(event, payload) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { toast("Not connected"); return false; }
    ws.send(JSON.stringify({ event, payload }));
    return true;
  }

  function scheduleConvReload() {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(loadConversations, 400);
  }

  function markRead(ids) {
    if (ids.length) { wsSend("message:read", { messageIds: ids }); scheduleConvReload(); }
  }

  function addMessage(m) {
    if (!messages.some((x) => x._id === m._id)) messages.push(m);
  }

  let currentSummary = null;
  let aiSuggestions = [];

  function requestSummary() {
    if (!active || !active.convId) { toast("No active conversation to summarize"); return; }
    toast("Generating summary...");
    const btn = document.getElementById("btnSummarize");
    if (btn) { btn.disabled = true; btn.textContent = "Generating..."; }
    wsSend("ai:summarize", { conversationId: active.convId });
  }

  function requestSuggestions() {
    if (!active || !active.convId) { toast("No active conversation for suggestions"); return; }
    toast("Generating suggestions...");
    const btn = document.getElementById("btnSuggest");
    if (btn) { btn.disabled = true; btn.textContent = "Generating..."; }
    wsSend("ai:suggest_replies", { conversationId: active.convId });
  }

  function renderSummaryBanner(summaryText) {
    const banner = $("aiSummaryBanner");
    if (!summaryText) {
      banner.classList.add("hidden");
      banner.replaceChildren();
      return;
    }
    banner.replaceChildren(
      el("div", {}, el("b", { textContent: "AI Summary: " }), summaryText),
      el("button", { textContent: "✕", onclick: () => renderSummaryBanner(null) })
    );
    banner.classList.remove("hidden");
  }

  function renderSuggestionsBar(suggestionsList) {
    const bar = $("aiSuggestionsBar");
    if (!suggestionsList || !suggestionsList.length) {
      bar.classList.add("hidden");
      bar.replaceChildren();
      return;
    }
    bar.replaceChildren(el("b", { style: "font-size:12px;color:#555", textContent: "AI Suggestions:" }));
    suggestionsList.forEach((s) => {
      const pill = el("button", { type: "button", className: "ai-pill", textContent: s });
      pill.onclick = () => {
        $("msgInput").value = s;
        $("msgInput").focus();
      };
      bar.append(pill);
    });
    bar.classList.remove("hidden");
  }

  function handleWS({ event, data }) {
    if (event === "message:sent") {
      if (active && (active.convId === data.conversation_id || active.convId === null)) {
        active.convId = data.conversation_id;
        addMessage(data);
        renderMessages("bottom");
      }
      scheduleConvReload();
    } else if (event === "message:new") {
      const inActive =
        active && (active.convId === data.conversation_id ||
        (active.convId === null && active.user._id === data.sender_id));
      if (inActive) {
        active.convId = data.conversation_id;
        addMessage(data);
        renderMessages("auto");
        markRead([data._id]);
      }
      scheduleConvReload();
    } else if (event === "message:delivered") {
      const m = messages.find((x) => x._id === data.messageId);
      if (m && m.status === "sent") { m.status = "delivered"; renderMessages("keep"); }
    } else if (event === "message:read") {
      let changed = false;
      messages.forEach((m) => {
        if (data.messageIds.includes(m._id)) { m.status = "read"; changed = true; }
      });
      if (changed) renderMessages("keep");
    } 
    else if (event === "presence:update") {
      const apply = (u) => {
        if (u && u._id === data.userId) {
          u.is_online = data.is_online;
          if (data.last_seen) u.last_seen = data.last_seen;
        }
      };
      conversations.forEach((c) => apply(c.user));
      if (active) apply(active.user);
      renderConversations();
      renderHeader();
    }
    else if (event === "ai:processing") {
      if (data.type === "summary") toast("Generating AI summary...");
      if (data.type === "reply_suggestions") toast("Generating reply suggestions...");
    }
    else if (event === "ai:summary") {
      const btn = document.getElementById("btnSummarize");
      if (btn) { btn.disabled = false; btn.textContent = "Summarize"; }
      if (active && active.convId === data.conversationId) {
        currentSummary = data.summary;
        renderSummaryBanner(currentSummary);
      }
    }
    else if (event === "ai:reply_suggestions") {
      const btn = document.getElementById("btnSuggest");
      if (btn) { btn.disabled = false; btn.textContent = "AI Suggestions"; }
      if (active && active.convId === data.conversationId) {
        aiSuggestions = data.suggestions;
        renderSuggestionsBar(aiSuggestions);
      }
    }
    else if (event === "ai:error") {
      const btnSum = document.getElementById("btnSummarize");
      if (btnSum) { btnSum.disabled = false; btnSum.textContent = "Summarize"; }
      const btnSug = document.getElementById("btnSuggest");
      if (btnSug) { btnSug.disabled = false; btnSug.textContent = "AI Suggestions"; }
      toast((data && data.message) || "AI operation failed");
    }
    else if (event === "error") {
      toast((data && data.message) || "Error");
    }
  }

  /* ---------- CONVERSATIONS ---------- */
  async function loadConversations() {
    if (!token) return;
    try {
      const { ok, data } = await api("/api/conversations");
      if (!ok || !token) return;
      conversations = data.data;
      if (active) {
        const c = conversations.find((x) => x.user && x.user._id === active.user._id);
        if (c) { active.user = c.user; if (!active.convId) active.convId = c._id; }
      }
      renderConversations();
      renderHeader();
    } catch (_) {}
  }

  function renderConversations() {
    const list = $("convList");
    list.replaceChildren();
    if (!conversations.length) {
      list.append(el("div", { style: "padding:14px;color:#888", textContent: "No chats yet. Search a user above." }));
      return;
    }
    conversations.forEach((c) => {
      const u = c.user;
      if (!u) return;
      const left = el("div", {},
        el("div", { className: "name" }, el("span", { className: "dot" + (u.is_online ? " on" : "") }), u.username),
        el("div", { className: "preview", textContent: c.lastMessage ? c.lastMessage.text : "" })
      );
      const item = el("div", { className: "conv" + (active && active.user._id === u._id ? " active" : "") }, left);
      if (c.unreadCount > 0) item.append(el("span", { className: "badge", textContent: String(c.unreadCount) }));
      item.onclick = () => openChat(c._id, u);
      list.append(item);
    });
  }

  /* ---------- CHAT ---------- */
  async function openChat(convId, user) {
    active = { convId, user };
    messages = [];
    currentSummary = null;
    aiSuggestions = [];
    nextCursor = null;
    loadingOlder = false;
    renderSummaryBanner(null);
    renderSuggestionsBar(null);
    renderConversations();
    renderHeader();
    renderChat();
    if (convId) await loadMessages(convId);
    $("msgInput").focus();
  }

  async function loadMessages(convId, before) {
    if (before) {
      if (loadingOlder) return;
      loadingOlder = true;
    }
    try {
      const q = "?limit=30" + (before ? "&before=" + encodeURIComponent(before) : "");
      const { ok, data } = await api(`/api/conversations/${convId}/messages${q}`);
      // Ignore stale responses if the user switched chats while this was loading.
      if (!ok || !active || active.convId !== convId) return;
      messages = before ? [...data.data, ...messages] : data.data;
      nextCursor = data.nextCursor;
      renderMessages(before ? "prepend" : "bottom");
      if (!before) {
        markRead(messages.filter((m) => m.sender_id !== myId() && m.status !== "read").map((m) => m._id));
      }
    } catch (_) {
    } finally {
      if (before) loadingOlder = false;
    }
  }

  function renderHeader() {
    const h = $("chatHeader");
    h.replaceChildren();
    if (!active) { h.append(el("span", { textContent: "Select or search a user to start chatting" })); return; }
    const u = active.user;
    const sub = u.is_online ? "online" : u.last_seen ? "last seen " + new Date(u.last_seen).toLocaleString() : "offline";
    
    const info = el("div", {}, el("b", { textContent: u.username }), el("small", { textContent: sub }));
    
    const actions = el("div", {},
      el("button", { id: "btnSummarize", className: "ai-btn", type: "button", textContent: "Summarize", onclick: requestSummary }),
      el("button", { id: "btnSuggest", className: "ai-btn", type: "button", textContent: "AI Suggestions", onclick: requestSuggestions })
    );

    h.append(info, actions);
  }

  function renderChat() {
    $("composer").classList.toggle("hidden", !active);
    renderMessages("bottom");
  }

  // mode: "bottom" = jump to newest, "auto" = stick to bottom only if already near it,
  //       "keep" = leave scroll where it is, "prepend" = keep view steady after loading older messages
  function renderMessages(mode = "auto") {
    const box = $("messages");
    const prevHeight = box.scrollHeight;
    const prevTop = box.scrollTop;
    const nearBottom = prevHeight - prevTop - box.clientHeight < 80;

    box.replaceChildren();
    if (!active) { box.append(el("div", { id: "empty", textContent: "No chat selected" })); return; }
    if (nextCursor) {
      const b = el("button", { className: "link", type: "button", textContent: "Load older messages" });
      b.onclick = () => loadMessages(active.convId, nextCursor);
      box.append(b);
    }
    const uid = myId();
    messages.forEach((m) => {
      const mine = m.sender_id === uid;
      const time = new Date(m.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const meta = el("div", { className: "meta" }, time);
      if (mine) {
        const t = m.status === "sent" ? "✓" : "✓✓";
        meta.append(el("span", { className: "tick" + (m.status === "read" ? " read" : ""), textContent: t }));
      }
      box.append(el("div", { className: "msg" + (mine ? " mine" : "") }, el("div", { textContent: m.text }), meta));
    });

    if (mode === "bottom" || (mode === "auto" && nearBottom)) box.scrollTop = box.scrollHeight;
    else if (mode === "prepend") box.scrollTop = box.scrollHeight - prevHeight + prevTop;
    else box.scrollTop = prevTop;
  }

  $("composer").onsubmit = (e) => {
  e.preventDefault();
  const text = $("msgInput").value.trim();
  if (!text || !active) return;
  const clientMessageId = crypto.randomUUID();
  if (wsSend("message:send", { recipientId: active.user._id, text, clientMessageId })) {
    $("msgInput").value = "";
  }
};

  /* ---------- SEARCH ---------- */
  $("searchInput").oninput = () => {
    clearTimeout(searchTimer);
    const q = $("searchInput").value.trim();
    const box = $("searchResults");
    if (!q) { box.classList.add("hidden"); return; }
    searchTimer = setTimeout(async () => {
      try {
        const { ok, data } = await api("/api/users/search?q=" + encodeURIComponent(q));
        // Drop results if the input changed (or was cleared) while the request was in flight.
        if (!ok || $("searchInput").value.trim() !== q) return;
        box.replaceChildren();
        const users = data.data.filter((u) => u._id !== myId());
        if (!users.length) box.append(el("div", { textContent: "No users found" }));
        users.forEach((u) => {
          const row = el("div", {}, el("span", { className: "dot" + (u.is_online ? " on" : "") }), u.username);
          row.onclick = () => {
            const existing = conversations.find((c) => c.user && c.user._id === u._id);
            openChat(existing ? existing._id : null, u);
            $("searchInput").value = "";
            box.classList.add("hidden");
          };
          box.append(row);
        });
        box.classList.remove("hidden");
      } catch (_) {}
    }, 250);
  };

  // Close the search dropdown when clicking elsewhere
  document.addEventListener("click", (e) => {
    if (!$("searchBox").contains(e.target)) $("searchResults").classList.add("hidden");
  });

  /* ---------- INIT ---------- */
  if (token && me) startApp();
  else $("auth").classList.remove("hidden");
</script>
</body>
</html>
